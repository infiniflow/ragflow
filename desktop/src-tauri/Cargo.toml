[package]
name = "ragflow-desktop"
version = "0.1.0"
description = "RAGFlow desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
# Size first: the Go sidecar is the bulk of the app, so the shell stays tiny.
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
