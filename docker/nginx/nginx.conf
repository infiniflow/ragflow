user  root;
worker_processes  auto;

# Keeps nginx off paths an arbitrary UID cannot write, and puts its logs where
# `docker logs` and `kubectl logs` can see them.
error_log  /dev/stderr notice;
pid        /ragflow/nginx/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    client_body_temp_path  /ragflow/nginx/tmp/client_body;
    proxy_temp_path        /ragflow/nginx/tmp/proxy;
    fastcgi_temp_path      /ragflow/nginx/tmp/fastcgi;
    uwsgi_temp_path        /ragflow/nginx/tmp/uwsgi;
    scgi_temp_path         /ragflow/nginx/tmp/scgi;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;
    client_max_body_size 1024M;

    include /ragflow/nginx/conf.d/ragflow.conf;
}
