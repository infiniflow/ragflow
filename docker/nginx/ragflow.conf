server {
    listen 80;
    server_name _;
    root /ragflow/web/dist;

    location ~ ^/api/v1/admin {
        proxy_pass http://127.0.0.1:9381;
        include proxy.conf;
    }

    location ~ ^/api/v1 {
        proxy_pass http://127.0.0.1:9380;
        include proxy.conf;
    }


    include /etc/nginx/web-static.conf;
}
