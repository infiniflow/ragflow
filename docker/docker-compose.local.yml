      - ../api/ragflow_server.py:/ragflow/api/ragflow_server.py:ro
      - ../admin/server/config.py:/ragflow/admin/server/config.py:ro
      - ../admin/server/routes.py:/ragflow/admin/server/routes.py:ro
      - ../admin/server/audit_feed.py:/ragflow/admin/server/audit_feed.py:ro
      - ../admin/server/admin_server.py:/ragflow/admin/server/admin_server.py:ro
      - ../admin/server/services.py:/ragflow/admin/server/services.py:ro
      - ../agent/business_requirements:/ragflow/agent/business_requirements:ro
      - ../agent/canvas.py:/ragflow/agent/canvas.py:ro
      - ../agent/templates/mrz_document_reader.json:/ragflow/agent/templates/mrz_document_reader.json:ro
      - ../agent/component/openmetadata.py:/ragflow/agent/component/openmetadata.py:ro
      - ../api/db/services/file_service.py:/ragflow/api/db/services/file_service.py:ro
      - ../api/db/services/task_service.py:/ragflow/api/db/services/task_service.py:ro
      - ../api/utils/file_utils.py:/ragflow/api/utils/file_utils.py:ro
      - ../common/constants.py:/ragflow/common/constants.py:ro
      - ../common/config_utils.py:/ragflow/common/config_utils.py:ro
      - ../common/log_utils.py:/ragflow/common/log_utils.py:ro
      - ../common/observability.py:/ragflow/common/observability.py:ro
      - ../common/ssrf_guard.py:/ragflow/common/ssrf_guard.py:ro
      - ../common/openmetadata_agents.py:/ragflow/common/openmetadata_agents.py:ro
      - ../common/data_source/__init__.py:/ragflow/common/data_source/__init__.py:ro
      - ../common/data_source/config.py:/ragflow/common/data_source/config.py:ro
      - ../common/data_source/eva_wiki_connector.py:/ragflow/common/data_source/eva_wiki_connector.py:ro
      - ../common/data_source/openmetadata_connector.py:/ragflow/common/data_source/openmetadata_connector.py:ro
      - ../common/data_source/html_utils.py:/ragflow/common/data_source/html_utils.py:ro
      - ../rag/svr/sync_data_source.py:/ragflow/rag/svr/sync_data_source.py:ro
      - ../rag/svr/task_executor.py:/ragflow/rag/svr/task_executor.py:ro
      - ../rag/utils/redis_conn.py:/ragflow/rag/utils/redis_conn.py:ro
      - ../rag/app/audio.py:/ragflow/rag/app/audio.py:ro
      - ../rag/app/picture.py:/ragflow/rag/app/picture.py:ro
      - ../rag/llm/chat_model.py:/ragflow/rag/llm/chat_model.py:ro
      - ../conf/system_settings.json:/ragflow/conf/system_settings.json:ro
      - ../web/dist:/ragflow/web/dist:ro
      - ./nginx/ragflow.conf.python:/etc/nginx/conf.d/ragflow.conf.python:ro
      - ./nginx/ragflow.conf.hybrid:/etc/nginx/conf.d/ragflow.conf.hybrid:ro
      - ./nginx/ragflow.conf.golang:/etc/nginx/conf.d/ragflow.conf.golang:ro
    networks:
      - ragflow
      - diagram_renderer

  sandbox-executor-manager:
    depends_on:
      sandbox-runtime-bootstrap:
        condition: service_healthy
    ports: !reset []

  sandbox-runtime-bootstrap:
    profiles:
      - sandbox
    image: ${SANDBOX_EXECUTOR_MANAGER_IMAGE-infiniflow/sandbox-executor-manager:latest}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/ensure-runsc-runtime
    environment:
      RUNSC_CHECK_INTERVAL_SECONDS: "30"
    network_mode: none
    pid: host
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/config/docker:/run/config/docker
      - /var/lib/docker/gvisor:/var/lib/docker/gvisor:ro
      - ./ensure_runsc_runtime.sh:/usr/local/bin/ensure-runsc-runtime:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          docker info --format '{{json .Runtimes}}' 2>/dev/null |
          grep -q '"runsc"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  es01:
    ports: !reset []

  mysql:
    profiles: !override
      - mysql
    ports: !reset []

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DBNAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ragflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DBNAME}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio:
    ports: !reset []

  redis:
    ports: !reset []

volumes:
  postgres_data:
