services:
  t-one-asr:
    build:
      context: ../services/asr-online-service
    restart: unless-stopped
    environment:
      ASR_FFMPEG_PATH: ffmpeg
      ASR_SOX_PATH: sox
      ASR_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ASR_OLLAMA_MODEL: ${T_ONE_ASR_OLLAMA_MODEL:-gpt-oss:20b}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9011/health/ready', timeout=5)"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - ragflow

  ragflow-cpu:
    depends_on: !override
      postgres:
        condition: service_healthy
      plantuml-server:
        condition: service_healthy
      t-one-asr:
        condition: service_healthy
    env_file: !override
      - path: .env
        required: true
      - path: .env.local
        required: false
    environment:
      WAIT_FOR_BACKEND_BEFORE_NGINX: "true"
      RAGFLOW_BACKEND_READY_TIMEOUT_SECONDS: "180"
      BUSINESS_DOCUMENT_WORKER_ENABLED: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --max-time 5
          http://127.0.0.1:9380/api/v1/system/healthz >/dev/null &&
          curl --fail --silent --max-time 5
          http://127.0.0.1/ >/dev/null
      interval: 5s
      timeout: 12s
      retries: 12
      start_period: 60s
    ports: !override
      - "0.0.0.0:9380:80"
    volumes:
      - ../api/db/services/connector_service.py:/ragflow/api/db/services/connector_service.py:ro
      - ../api/db/services/access_group_service.py:/ragflow/api/db/services/access_group_service.py:ro
      - ../api/db/services/business_document_settings_service.py:/ragflow/api/db/services/business_document_settings_service.py:ro
      - ../api/db/services/knowledgebase_service.py:/ragflow/api/db/services/knowledgebase_service.py:ro
      - ../api/db/services/managed_resource_service.py:/ragflow/api/db/services/managed_resource_service.py:ro
      - ../api/db/services/navigation_visibility_service.py:/ragflow/api/db/services/navigation_visibility_service.py:ro
      - ../api/db/services/user_external_credential_service.py:/ragflow/api/db/services/user_external_credential_service.py:ro
      - ../api/db/joint_services/tenant_model_service.py:/ragflow/api/db/joint_services/tenant_model_service.py:ro
      - ../api/apps/llm_app.py:/ragflow/api/apps/llm_app.py:ro
      - ../api/apps/restful_apis/chat_channel_api.py:/ragflow/api/apps/restful_apis/chat_channel_api.py:ro
      - ../api/apps/restful_apis/connector_api.py:/ragflow/api/apps/restful_apis/connector_api.py:ro
      - ../api/apps/restful_apis/dataset_api.py:/ragflow/api/apps/restful_apis/dataset_api.py:ro
      - ../api/apps/restful_apis/document_api.py:/ragflow/api/apps/restful_apis/document_api.py:ro
      - ../api/apps/restful_apis/file_commit_api.py:/ragflow/api/apps/restful_apis/file_commit_api.py:ro
      - ../api/apps/restful_apis/models_api.py:/ragflow/api/apps/restful_apis/models_api.py:ro
      - ../api/apps/restful_apis/provider_api.py:/ragflow/api/apps/restful_apis/provider_api.py:ro
      - ../api/apps/restful_apis/agent_api.py:/ragflow/api/apps/restful_apis/agent_api.py:ro
      - ../api/apps/restful_apis/bot_api.py:/ragflow/api/apps/restful_apis/bot_api.py:ro
      - ../api/apps/services/agent_file_service.py:/ragflow/api/apps/services/agent_file_service.py:ro
      - ../api/apps/services/openmetadata_copilot_service.py:/ragflow/api/apps/services/openmetadata_copilot_service.py:ro
      - ../api/apps/services/openmetadata_agent_service.py:/ragflow/api/apps/services/openmetadata_agent_service.py:ro
      - ../api/apps/services/openmetadata_dataset_retrieval.py:/ragflow/api/apps/services/openmetadata_dataset_retrieval.py:ro
      - ../api/apps/restful_apis/openmetadata_api.py:/ragflow/api/apps/restful_apis/openmetadata_api.py:ro
      - ../api/apps/services/dataset_api_service.py:/ragflow/api/apps/services/dataset_api_service.py:ro
      - ../api/apps/services/models_api_service.py:/ragflow/api/apps/services/models_api_service.py:ro
      - ../api/apps/business_documents:/ragflow/api/apps/business_documents:ro
      - ../api/apps/restful_apis/business_document_api.py:/ragflow/api/apps/restful_apis/business_document_api.py:ro
