# GitLab CI: сборка Docker-образа RAGFlow при пуше в feature-ветку.
# Аналог конфигов в других проектах (DinD + приватный registry docker.citysense.ru).
#
# Требуемые переменные в Settings -> CI/CD -> Variables (masked):
#   DOCKER_REGISTRY_URL      например docker.citysense.ru
#   DOCKER_REGISTRY_USER
#   DOCKER_REGISTRY_PASSWORD
#   DOCKER_AUTH_CONFIG       (опционально, для docker executor)

stages:
  - build-and-push

variables:
  DOCKER_AUTH_CONFIG: $DOCKER_AUTH_CONFIG
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""  # Отключаем TLS
  # Ветка, при пуше в которую собирается образ
  BUILD_BRANCH: feature/yandex-disk
  IMAGE_NAME: $DOCKER_REGISTRY_URL$CI_PROJECT_NAME

services:
  - name: docker:28.1.1
    alias: docker

build-and-push-job:
  stage: build-and-push
  image: docker:28.1.1
  timeout: 2h
  rules:
    - if: $CI_COMMIT_BRANCH == $BUILD_BRANCH && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USER" --password-stdin $DOCKER_REGISTRY_URL
  script:
    # Docker-тег не допускает "/", приводим имя ветки к допустимому виду
    - TAG=${CI_COMMIT_BRANCH//\//-}
    - echo "Building $IMAGE_NAME:$TAG ($CI_COMMIT_SHORT_SHA)"
    - docker build --progress=plain -f Dockerfile -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE_NAME:$TAG
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  after_script:
    - docker logout $DOCKER_REGISTRY_URL
