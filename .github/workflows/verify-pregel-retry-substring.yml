name: Fork retry predicate verification

on:
  push:
    branches:
      - fix/pregel-retry-predicates-substring

permissions:
  contents: read

jobs:
  retry-predicate-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files=$(gofmt -l internal/harness/graph/pregel/retry.go internal/harness/graph/pregel/retry_predicates_test.go)
          test -z "$files" || { echo "$files"; exit 1; }
      - name: Run Pregel retry regression tests
        env:
          CGO_ENABLED: "0"
          GOPRIVATE: github.com/infiniflow/onnxruntime_go
        run: go test -count=1 -v ./internal/harness/graph/pregel -run '^TestRetry(PredicatesMatchEmbeddedErrorMarkers|ExecutorRetriesEmbeddedNetworkError)$'
