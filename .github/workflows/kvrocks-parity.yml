name: Kvrocks Parity

# Regression fence for the Valkey -> apache/kvrocks:2.16.0 migration. Runs the
# //go:build integration parity tests (internal/engine/redis, internal/agent/canvas)
# against a real Kvrocks instance. These tests are NOT part of the default
# `go test` run, so this workflow is what actually executes them in CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one in-flight run per ref; cancel superseded runs on PR pushes.
concurrency:
  group: kvrocks-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kvrocks-parity:
    runs-on: ubuntu-latest
    env:
      # CI=true makes the parity tests hard-fail (not skip) if Kvrocks is absent.
      CI: "true"
      KV_PASSWORD: ci-test-pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Pinned to 2.16.0+ on purpose (TTL contract + no maxmemory). Reuse the repo
      # entrypoint script so this job also exercises the deployment's conf renderer.
      # `-e REDIS_PASSWORD` forwards the password into the container so the
      # entrypoint can render requirepass; without it Kvrocks starts open and the
      # parity tests fail to AUTH.
      - name: Start Kvrocks
        run: |
          docker run -d --name kvrocks -p 6379:6379 -e REDIS_PASSWORD \
            -v "${{ github.workspace }}/docker/kvrocks-entrypoint.sh:/etc/kvrocks/entrypoint.sh:ro" \
            --user 0:0 --entrypoint /bin/sh apache/kvrocks:2.16.0 -c "/etc/kvrocks/entrypoint.sh"
        env:
          REDIS_PASSWORD: ci-test-pass

      - name: Wait for Kvrocks
        env:
          REDIS_PASSWORD: ci-test-pass
        run: |
          for i in $(seq 1 30); do
            if docker exec kvrocks redis-cli -a "${REDIS_PASSWORD}" ping 2>/dev/null | grep -q PONG; then
              echo "Kvrocks ready"; break
            fi
            sleep 1
          done

      - name: Run parity tests
        run: |
          CGO_ENABLED=0 go test -tags integration -count=1 -timeout 300s \
            ./internal/engine/redis/... ./internal/agent/canvas/...
        env:
          KV_ADDR: "localhost:6379"
          KV_PASSWORD: ci-test-pass

      - name: Stop Kvrocks
        if: always()
        run: docker rm -f kvrocks
