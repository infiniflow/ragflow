{{- $fullname := include "ragflow.fullname" . -}}
{{- $selectorLabels := include "ragflow.selectorLabels" . -}}
{{- $image := include "ragflow.imageRepo" (dict "root" . "repo" .Values.ragflow.image.repository) -}}
{{- $imagePullSecrets := concat (default (list) .Values.global.imagePullSecrets) (default (list) .Values.ragflow.image.pullSecrets) -}}
{{- $preStopCommand := default "/usr/sbin/nginx -s quit\nwhile [ -s /var/run/nginx.pid ] && kill -0 \"$(cat /var/run/nginx.pid)\" 2>/dev/null; do\n  sleep 2\ndone\n" .Values.ragflow.api.preStopCommand -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow-api
spec:
  replicas: {{ .Values.ragflow.api.replicaCount }}
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
      app.kubernetes.io/component: ragflow-api
  strategy:
    {{- .Values.ragflow.api.strategy | toYaml | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "ragflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: ragflow-api
      annotations:
        checksum/values: {{ .Values | toYaml | sha256sum }}
        checksum/config-env: {{ include (print $.Template.BasePath "/env.yaml") . | sha256sum }}
        checksum/config-ragflow: {{ include (print $.Template.BasePath "/ragflow_config.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.ragflow.api.terminationGracePeriodSeconds }}
      {{- with .Values.ragflow.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- $imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: ragflow-api
          image: {{ $image }}:{{ .Values.ragflow.image.tag }}
          imagePullPolicy: {{ .Values.ragflow.image.pullPolicy }}
          args:
            - --disable-taskexecutor
            - --disable-datasync
            {{- if .Values.ragflow.initSuperuser }}
            - --init-superuser
            {{- end }}
            {{- if .Values.ragflow.admin.enabled }}
            - --enable-adminserver
            {{- end }}
          ports:
            - containerPort: 80
              name: http
            - containerPort: 9380
              name: http-api
            {{- if .Values.ragflow.admin.enabled }}
            - containerPort: 9381
              name: admin
            {{- end }}
          readinessProbe:
            {{- toYaml .Values.ragflow.api.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.ragflow.api.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.ragflow.api.livenessProbe | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", {{ $preStopCommand | quote }}]
          volumeMounts:
            {{- include "ragflow.volumeMounts" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}-env-config
          {{- with .Values.ragflow.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "ragflow.volumes" . | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-executor
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow-executor
spec:
  replicas: {{ .Values.ragflow.executor.replicaCount }}
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
      app.kubernetes.io/component: ragflow-executor
  {{- with .Values.ragflow.executor.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "ragflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: ragflow-executor
      annotations:
        checksum/values: {{ .Values | toYaml | sha256sum }}
        checksum/config-env: {{ include (print $.Template.BasePath "/env.yaml") . | sha256sum }}
        checksum/config-ragflow: {{ include (print $.Template.BasePath "/ragflow_config.yaml") . | sha256sum }}
    spec:
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- $imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: ragflow-executor
          image: {{ $image }}:{{ .Values.ragflow.image.tag }}
          imagePullPolicy: {{ .Values.ragflow.image.pullPolicy }}
          args:
            - --disable-webserver
            - --disable-datasync
            - --workers={{ .Values.ragflow.executor.workers }}
          volumeMounts:
            {{- include "ragflow.volumeMounts" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}-env-config
          {{- with .Values.ragflow.executor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "ragflow.volumes" . | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-data-sync
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow-data-sync
spec:
  replicas: {{ .Values.ragflow.dataSync.replicaCount }}
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
      app.kubernetes.io/component: ragflow-data-sync
  {{- with .Values.ragflow.dataSync.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "ragflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: ragflow-data-sync
      annotations:
        checksum/values: {{ .Values | toYaml | sha256sum }}
        checksum/config-env: {{ include (print $.Template.BasePath "/env.yaml") . | sha256sum }}
        checksum/config-ragflow: {{ include (print $.Template.BasePath "/ragflow_config.yaml") . | sha256sum }}
    spec:
      {{- if $imagePullSecrets }}
      imagePullSecrets:
        {{- $imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: ragflow-data-sync
          image: {{ $image }}:{{ .Values.ragflow.image.tag }}
          imagePullPolicy: {{ .Values.ragflow.image.pullPolicy }}
          args:
            - --disable-webserver
            - --disable-taskexecutor
          volumeMounts:
            {{- include "ragflow.volumeMounts" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}-env-config
          {{- with .Values.ragflow.dataSync.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "ragflow.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow-api
spec:
  selector:
    {{- $selectorLabels | nindent 4 }}
    app.kubernetes.io/component: ragflow-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
      name: http
  type: {{ .Values.ragflow.service.type }}
{{- if .Values.ragflow.api.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow-api
spec:
  selector:
    {{- $selectorLabels | nindent 4 }}
    app.kubernetes.io/component: ragflow-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: http-api
      name: http-api
  type: {{ .Values.ragflow.api.service.type }}
{{- end }}
{{- if .Values.ragflow.admin.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: ragflow-api
spec:
  selector:
    {{- $selectorLabels | nindent 4 }}
    app.kubernetes.io/component: ragflow-api
  ports:
    - protocol: TCP
      port: {{ .Values.ragflow.admin.port }}
      targetPort: admin
      name: admin
  type: {{ .Values.ragflow.admin.serviceType }}
{{- end }}
