# There are 7 fix-capable jobs and 5 pure-check jobs in pre-commit. One of the
# fix-capable jobs is the web pair merged into one (web-format-lint: oxfmt +
# oxlint): it runs only when a web/ file is staged and goes through
# tools/hooks/web_tools.sh's lightweight oxlint/oxfmt cache (a ~35 MB install of
# two prebuilt binaries, NOT web/'s full dependency tree), so a backend-only
# commit never touches Node. Merging them into one job means the installer is
# invoked once, so parallel pre-commit jobs cannot race a cold cache. A separate
# CI-only `web-checks` hook at the bottom installs/reuses web deps (`web-deps`),
# then runs the whole-project type check (`web-typecheck`, tsc) and the unit tests
# (`web-test`), plus the tests/ convention guard —
# format/lint are NOT repeated there because CI already runs pre-commit.
# Dual-mode pre-commit: by default (local dev) jobs fix and stage changes
# (`stage_fixed: true` batches the `git add` per job to avoid the index lock
# that parallel `git add` calls would hit). In CI, set LEFTHOOK_CHECK_ONLY=1
# to skip --fix on every fix-capable job. With no files modified, `stage_fixed`
# becomes a no-op, so CI only verifies and exits non-zero on issues.
#
# NOTE: every `run:` block is written in POSIX-sh-compatible syntax
# (`[` ... `]` with `=` for string compare) instead of bash `[[` ...
# `]]`. Lefthook executes scripts via `/bin/sh`, which is `dash` on
# most Linux CI runners and would otherwise fail with
# `sh: 1: [[: not found`. Keeping the hooks POSIX avoids pinning
# lefthook to bash and keeps them portable to macOS/Linux/containers.
pre-commit:
  parallel: true
  jobs:
    - name: end-of-file-fixer
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          python3 tools/hooks/check_files.py eof
        else
          python3 tools/hooks/check_files.py eof --fix
        fi
    - name: trailing-whitespace
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          python3 tools/hooks/check_files.py trailing-whitespace
        else
          python3 tools/hooks/check_files.py trailing-whitespace --fix
        fi
    - name: mixed-line-ending
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          python3 tools/hooks/check_files.py mixed-line-ending
        else
          python3 tools/hooks/check_files.py mixed-line-ending --fix
        fi
    - name: ruff
      glob: "*.py"
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          ruff check {staged_files}
        else
          ruff check --fix {staged_files}
        fi
    - name: ruff-format
      glob: "*.py"
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          ruff format --check {staged_files}
        else
          ruff format {staged_files}
        fi
    - name: gofmt
      glob: "*.go"
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          unformatted=$(gofmt -l {staged_files})
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
        else
          gofmt -w {staged_files}
        fi
    # Frontend format + lint in ONE job: it invokes web_tools.sh once (a single
    # installer call, so parallel pre-commit jobs cannot race a cold cache), then
    # runs oxfmt and oxlint over the same staged files. Scoped to web/ by the
    # glob, so backend-only commits never touch Node. The exclude anchor is
    # defined here (its first use). CI runs this via the pre-commit hook
    # (LEFTHOOK_CHECK_ONLY=1), so web-checks does NOT repeat it.
    - name: web-format-lint
      glob: "web/**/*.{css,less,json,js,jsx,ts,tsx}"
      exclude: &web_exclude ["web/**/*.min.js", "web/**/*.min.css", "web/package-lock.json", "web/node_modules/**", "web/.next/**", "web/dist/**"]
      root: "web/"
      stage_fixed: true
      run: |
        bin="$(../tools/hooks/web_tools.sh)"
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          status=0
          "$bin/oxfmt" --check {staged_files} || status=1
          "$bin/oxlint" {staged_files} || status=1
          exit $status
        else
          "$bin/oxfmt" {staged_files}
          "$bin/oxlint" --fix {staged_files}
        fi
    - name: check-yaml
      run: python3 tools/hooks/check_files.py yaml
    - name: check-json
      run: python3 tools/hooks/check_files.py json
    - name: check-case-conflict
      run: python3 tools/hooks/check_files.py case-conflict
    - name: check-merge-conflict
      run: python3 tools/hooks/check_files.py merge-conflict
    - name: check-symlinks
      run: python3 tools/hooks/check_files.py symlinks

# CI-only web gate. Format/lint are intentionally NOT here: sep-tests.yml runs
# the pre-commit hook (LEFTHOOK_CHECK_ONLY=1) first, and that already runs
# web-format-lint (oxfmt + oxlint) — listing them again would run them twice on
# every PR. What remains: web-deps (install/reuse web/node_modules), web-typecheck
# (tsc), web-test (jest), and the tests/ convention guard. sep-tests.yml runs
# `lefthook run web-checks` on the files a PR changed, and that run is what blocks.
# By hand: `npm run type-check` / `npm run test` from web/.
web-checks:
  # Sequential (piped): web-deps installs (or reuses) web/node_modules, and the
  # type check + tests then reuse it.
  piped: true
  jobs:
    # Install web deps ONCE, skipping the heavy `npm ci` when node_modules already
    # matches the current lockfile. The runner is self-hosted, so the checkout
    # (and node_modules) persists across runs; the lockfile hash is the cache key.
    - name: web-deps
      glob: "web/**/*.{ts,tsx,js,jsx}"
      exclude: *web_exclude
      root: "web/"
      run: |
        stamp=node_modules/.ci-lock.sha
        want=$(sha256sum package-lock.json | cut -d' ' -f1)
        if [ ! -d node_modules ] || [ ! -f "$stamp" ] || [ "$(cat "$stamp" 2>/dev/null)" != "$want" ]; then
          npm ci --no-audit --no-fund --loglevel=error >&2
          echo "$want" > "$stamp"
        fi
    # Type gate. oxlint does not check types, so a PR can still break the build
    # with type errors (missing/renamed props, drifted enums, nullability). tsc is
    # whole-project, so the glob runs it whenever any web TS/TSX changes. It reuses
    # the node_modules installed by web-deps. Run `npm run type-check` locally.
    - name: web-typecheck
      glob: "web/**/*.{ts,tsx}"
      exclude: *web_exclude
      root: "web/"
      run: node_modules/.bin/tsc --noEmit
    # Unit tests (blocking). The whole jest suite is green on this branch, so a
    # failure here blocks the PR like any other gate. Run `npm run test` locally.
    - name: web-test
      glob: "web/**/*.{ts,tsx,js,jsx}"
      exclude: *web_exclude
      root: "web/"
      run: npm test
    # Convention guard: frontend tests grouped in a directory must use
    # __tests__/, never tests/ (see web/AGENTS.md "Test File Placement").
    # Lefthook skips a job whose glob matches no files, so this job only runs
    # — and fails — when a changed file sits inside a tests/ directory.
    - name: web-no-tests-dir
      glob: "web/**/tests/**"
      root: "web/"
      run: |
        echo "Forbidden test directory: frontend tests belong in __tests__/, not tests/ (web/AGENTS.md):"
        printf '  %s\n' {files}
        exit 1
