schema_version: 1
status: T0 provenance and responsibility inventory; not an enforced import allowlist
owner_roles:
  fork-maintainer:
    repository: meownm/ragflow
    basis: Verified local origin URL; responsibility role, not an assertion of a new
      personal assignment
ownership_policy: One primary maintenance owner per file; shared files list integration
  dependencies. Classes are derived from base-tree membership, never inferred from
  these path groups.
dependency_policy: integration_dependencies describe observed/conceptual collaborations,
  including bidirectional business workflows; they are NOT approved import edges.
  Exact symbol allowlists are T2 work.
