  - test/unit_test/tools/quality/test_task_executor_entrypoint.py::test_task_executor_main_cancels_report_and_workers_on_stop
  - test/unit_test/tools/quality/test_task_executor_entrypoint.py::test_task_executor_collect_replays_unacked_before_live_queue
  - test/unit_test/tools/quality/test_task_executor_entrypoint.py::test_task_executor_collect_acks_non_runnable_messages
