  - test/unit_test/tools/quality/test_task_executor_entrypoint.py::test_task_executor_cancellation_completes_and_acks
  - test/unit_test/tools/quality/test_task_executor_entrypoint.py::test_task_executor_failure_marks_trace_progress_and_acks
  - test/unit_test/tools/quality/test_task_executor_entrypoint.py::test_task_executor_task_manager_releases_limiter_when_cancelled
  - test/unit_test/tools/quality/test_task_executor_entrypoint.py::test_task_executor_collect_hydrates_special_fanout_task
  - test/unit_test/tools/quality/test_task_executor_entrypoint.py::test_task_executor_records_special_pipeline_operation_before_ack
  - test/unit_test/tools/quality/test_task_executor_entrypoint.py::test_task_executor_heartbeat_reports_and_cleans_expired_workers
