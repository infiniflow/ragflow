- id: admin-server-bootstrap
  owner_module: observability
  profile: root-python-api-worker
  rule_id: ARC-02
  kind: pytest_contract
  timeout_seconds: 60
  test_ids:
  - test/unit_test/tools/quality/test_admin_server_bootstrap.py::test_admin_server_bootstrap_contract_is_exact
